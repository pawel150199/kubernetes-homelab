apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secretsmanager
  # Must live in the external-secrets namespace:
  # - bitwarden-access-token is created there (see README)
  # - SecretStore can only reference secrets in its own namespace
  # - ExternalSecrets (e.g. gitops/tests) are deployed there too
  namespace: external-secrets
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      auth:
        secretRef:
          credentials:
            key: token
            name: bitwarden-access-token
            namespace: external-secrets
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      organizationID: 48a79436-60c2-4790-a35f-b4fc0167ab99
      projectID: 92a3126a-c781-41db-b252-b4fc016e34bb
