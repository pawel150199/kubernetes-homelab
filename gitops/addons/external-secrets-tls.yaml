# TLS certificates needed by bitwarden-sdk-server
#
# The bitwarden-sdk-server subchart (part of the external-secrets chart) mounts
# the secret "bitwarden-tls-certs" with keys: tls.crt, tls.key and ca.crt.
# The secret must exist before the pod starts.
# It cannot be generated by the helm chart - cert-manager has to create it.

# Self-signed issuer used only for the internal SDK server certificate
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bitwarden-selfsigned-issuer
spec:
  selfSigned: {}
---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-tls-certs
  namespace: external-secrets
spec:
  secretName: bitwarden-tls-certs
  # isCA: true makes cert-manager put ca.crt into the secret as well,
  # which the bitwarden-sdk-server volume mount requires (mapped to ca.pem).
  # With a self-signed issuer the certificate signs itself, so ca.crt == tls.crt
  # and ESO can use it via caProvider in the SecretStore.
  isCA: true
  commonName: bitwarden-sdk-server.external-secrets.svc.cluster.local
  # SANs must cover the URL used by ESO in secret-store.yaml:
  # https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
  dnsNames:
    - bitwarden-sdk-server.external-secrets.svc.cluster.local
    - bitwarden-sdk-server.external-secrets.svc
    - bitwarden-sdk-server.external-secrets
    - bitwarden-sdk-server
    - localhost
  ipAddresses:
    - 127.0.0.1
    - "::1"
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  issuerRef:
    name: bitwarden-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
