apiVersion: aroproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  finalizers:
    - resources-finalier.argocd.argoproj.io
spec:
  project: addons
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targgetRevision: 3.114.0
      helm:
        releaseName: metrics-server
        valueFiles:
          - $values/gitops/addons/values/metrics-server.yaml
    - repoURL: https://github.com/pawel150199/kubernetes-homelab.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
  revisionHistoryLimit: 5
