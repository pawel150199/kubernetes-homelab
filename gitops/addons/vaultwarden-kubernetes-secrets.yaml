apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden-kuberentes-secrets
  namespace: argocd
  finalizers:
    - resources-finalozer.argocd.argoproj.io
  labels:
    name: vaultwarden-kuberentes-secrets
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/antoniolago/charts/vaultwarden-kubernetes-secrets
      chart: vaultwarden-kubernetes-secrets
      targetRevision: 2.1.0
      helm:
        releaseName: vaultwarden-kuberentes-secrets
        valuesFiles:
          - $values/gitops/addons/values/aultwarden-kuberentes-secrets.yaml
    - repoURL: https://github.com/pawel150199/kubernetes-homelab.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
