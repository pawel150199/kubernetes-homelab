serviceAccount:
  create: true
  name: "vaultwarden-kubernetes-secrets"

namespace:
  create: false
  name: "vaultwarden"

# Ingress Configuration
ingress:
  enabled: false
  className: "" #e.g: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts: []
    # - host: vaultwarden-sync.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    #       backend: dashboard
    #       port: 80
    #     - path: /api
    #       pathType: Prefix
    #       backend: api
    #       port: 8080
  tls: []
    # - secretName: vaultwarden-sync-tls
    #   hosts:
    #     - vaultwarden-sync.example.com

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

env:
  config:
    VAULTWARDEN__SERVERURL: "http://vaultwarden.vaultwarden.svc.cluster.local" # Your vw server url
    VAULTWARDEN__ORGANIZATIONID: "" #RECOMMENDED
    VAULTWARDEN__ORGANIZATIONNAME: ""
    VAULTWARDEN__FOLDERID: ""
    VAULTWARDEN__FOLDERNAME: ""
    VAULTWARDEN__COLLECTIONID: "" #RECOMMENDED
    VAULTWARDEN__COLLECTIONNAME: ""
  secrets:
    # For security, I suggest creating an account just for this purpose
    # WARNING: Organization API keys are not supported by VW API
    BW_CLIENTID:
      secretName: "vaultwarden-kubernetes-secrets"
      secretKey: "BW_CLIENTID"
    BW_CLIENTSECRET:
      secretName: "vaultwarden-kubernetes-secrets"
      secretKey: "BW_CLIENTSECRET"
    VAULTWARDEN__MASTERPASSWORD:
      secretName: "vaultwarden-kubernetes-secrets"
      secretKey: "VAULTWARDEN__MASTERPASSWORD"

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

  # Enable Grafana dashboard ConfigMap
  grafanaDashboard:
    enabled: true
    namespace: ""  # Leave empty to use release namespace
    labels:
      grafana_dashboard: "1"
    annotations: {}
