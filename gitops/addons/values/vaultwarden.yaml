domain: "https://vaultwarden.tail692efe.ts.net"

storage:
  data:
    name: "vaultwarden-data"
    size: "5Gi"
    class: "hcloud-volumes"
    accessMode: "ReadWriteOnce"
    keepPvc: true

ingress:
  enabled: true
  class: "tailscale"
  nginxIngressAnnotations: false
  tls: true
  tlsSecret: ""
  hostname: "vaultwarden"

# TODO: Currently there is not SMTP server so
# it won't be possible to create new accounts
signupsVerify: "true"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi
