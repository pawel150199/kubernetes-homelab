serviceAccount:
  create: true
  name: "vaultwarden-kubernetes-secrets"
namespace:
  create: false
  name: "vaultwarden"
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 256Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
env:
  config:
    VAULTWARDEN__SERVERURL: "https://vaultwarden.tail692efe.ts.net"
    VAULTWARDEN__ORGANIZATIONID: "my-org"
    VAULTWARDEN__ORGANIZATIONNAME: "my-org"
  secrets:
    # For security, I suggest creating an account just for this purpose
    # WARNING: Organization API keys are not supported by VW API
    BW_CLIENTID:
      secretName: "vaultwarden-kubernetes-secrets"
      secretKey: "BW_CLIENTID"
    BW_CLIENTSECRET:
      secretName: "vaultwarden-kubernetes-secrets"
      secretKey: "BW_CLIENTSECRET"
    VAULTWARDEN__MASTERPASSWORD:
      secretName: "vaultwarden-kubernetes-secrets"
      secretKey: "VAULTWARDEN__MASTERPASSWORD"
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  # Enable Grafana dashboard ConfigMap
  grafanaDashboard:
    enabled: true
    namespace: ""  # Leave empty to use release namespace
    labels:
      grafana_dashboard: "1"
    annotations: {}
