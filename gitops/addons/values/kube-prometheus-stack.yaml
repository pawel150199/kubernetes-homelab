grafana:
  enabled: true
  adminUser: admin
  defaultDashboardsTimezone: Europe/Warsaw
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Give Grafana time to load its bundled plugins on a slow node. Without a
  # startup probe the liveness probe kills it while it is still starting.
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: tailscale
    hosts:
      - grafana
    path: /
    tls:
      - hosts:
          - grafana
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: hcloud-volumes
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    dashboards:
      enabled: true
      searchNamespace: monitoring
      label: grafana_dashboard
      folder: /var/lib/grafana/dashboards
      # Put each dashboard in the folder named by this ConfigMap annotation.
      # Requires provider.foldersFromFilesStructure below so Grafana also
      # creates the folders described by the sidecar's directory layout.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local

prometheus:
  prometheusSpec:
    additionalArgs:
      - name: web.enable-remote-write-receiver
    retention: 7d
    retentionSize: "5GB"
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

defaultRules:
  create: true
