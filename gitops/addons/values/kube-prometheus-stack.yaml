grafana:
  enabled: true
  adminUser: admin
  defaultDashboardsTimezone: Europe/Warsaw
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: tailscale
    hosts:
      - grafana
    path: /
    tls:
      - hosts:
          - grafana
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: hcloud-volumes
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

prometheus:
  prometheusSpec:
    additionalArgs:
      - name: web.enable-remote-write-receiver
    retention: 7d
    retentionSize: "5GB"
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
