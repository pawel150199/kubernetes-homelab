# Loki in SingleBinary mode for the homelab.
# Chart: grafana/loki 7.5.0 (Loki 3.6.x)
#
# Pod logs are collected by Grafana Alloy (see values/alloy.yaml).
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  rulerConfig:
    storage:
      type: local
      local:
        directory: /etc/loki/rules

  # Resolved via limits_config (Loki 3.x). table_manager is legacy and
  # only works with the old boltdb-shipper schema.
  limits_config:
    retention_period: 64h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 5Gi
    # Do not delete the PVC together with the StatefulSet (an Argo CD prune
    # or a re-sync must not wipe the log data).
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 250m

# Keep the nginx gateway: Grafana and Alloy push/query through it.
# Service: loki-gateway.monitoring.svc.cluster.local
gateway:
  enabled: true

monitoring:
  selfMonitoring:
    enabled: true
