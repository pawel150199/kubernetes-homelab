# Loki in SingleBinary mode for the homelab.
# Chart: grafana/loki 7.5.0 (Loki 3.6.x)
#
# Pod logs are collected by Grafana Alloy (see values/alloy.yaml).
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # The ruler is part of the SingleBinary target and always initialises its
  # storage, even though this homelab does not ship any alerting rules.
  # Do NOT point it at /etc/loki: that path is the read-only ConfigMap mount
  # and Loki crashes with "mkdir /etc/loki/rules: read-only file system".
  # /var/loki is the writable PVC and matches the chart's default
  # common.storage.filesystem.rules_directory.
  rulerConfig:
    storage:
      type: local
      local:
        directory: /var/loki/rules

  # Resolved via limits_config (Loki 3.x). table_manager is legacy and
  # only works with the old boltdb-shipper schema.
  limits_config:
    retention_period: 64h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 2Gi
    # Do not delete the PVC together with the StatefulSet (an Argo CD prune
    # or a re-sync must not wipe the log data).
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 250m

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
ingester:
  replicas: 0
distributor:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
indexGateway:
  replicas: 0
ruler:
  replicas: 0
tableManager:
  enabled: false

# Keep the nginx gateway: Grafana and Alloy push/query through it.
# Service: loki-gateway.monitoring.svc.cluster.local
gateway:
  enabled: true

# Single-node homelab: skip the extra memcached, canary and helm-test pods.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# No alerting rules are shipped, so drop the k8s-sidecar that watches
# ConfigMaps/Secrets labelled loki_rule (it writes to an emptyDir the ruler
# does not read from anyway).
sidecar:
  rules:
    enabled: false
