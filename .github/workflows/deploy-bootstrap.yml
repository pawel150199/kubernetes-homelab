name: Deploy Homelab Bootstrap Cluster

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Pre-commit check"]
    types: [completed]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Check for bootstrap changes
        id: filter
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - skipping path filter."
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$(git rev--parse --verify --quiet "${HEAD_SHA}^" || true)"
          if [ -z "$base" ]; then
            echo "No parent commit found - deploying to be safe."
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"

            echo "Bootstrap changed - deployment will run."
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "No bootstrap changes - skipping deployment."
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

  dry-run-deploy:
    runs-on: ubuntu-latest
    environment: homelab
    needs: check_changes
    if: ${{ needs.check-changes.outputs.bootstrap == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha ||  github.ref }}

      - name: Tailscale setup
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.CI_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.CI_TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Set up terraform
        uses: hashicorp/setup-terraform@v4

      - name: Verify terraform installation
        run: |
          terraform -help

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS connection
        run: |
          aws sts get-caller-identity

      - name: Setup kube config
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" >> bootstrap/.kube/config

      - name: Dry-run Deploy Homelab Bootstrap Cluster
        run: |
          cd bootstrap
          terraform init
          terraform plan -out=tfplan -input=false
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TF_VAR_tailscale_oauth_client_secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: |
            bootstrap/tfplan
            bootstrap/plan.txt
          retention-days: 1

  wait-for-approval:
    runs-on: ubuntu-latest
    needs: dry-run-deploy
    permissions:
      issues: write
    steps:
      - name: Wait for approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.repository_owner }}
          minimum-approvals: 1
          issue-title: "Deploying bootstrap to Homelab"
          issue-body: "Please approve of deny the deployment"
          fail-on-denial: true

  deploy:
    runs-on: ubuntu-latest
    environment: homelab
    needs: wait-for-approval
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Tailscale setup
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.CI_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.CI_TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Set up terraform
        uses: hashicorp/setup-terraform@v4

      - name: Verify terraform installation
        run: |
          terraform -help

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS connection
        run: |
          aws sts get-caller-identity

      - name: Download Terraform plan output
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: bootstrap

      - name: Setup kube config
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" >> bootstrap/.kube/config

      - name: Deploy Homelab Bootstrap Cluster
        run: |
          cd bootstrap
          terraform init
          terraform apply -input=false tfplan
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TF_VAR_tailscale_oauth_client_secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
