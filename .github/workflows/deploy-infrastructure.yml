name: Deploy Homelab infrastructure

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Pre-commit check"]
    types: [completed]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Check for infrastructure changes
        id: filter
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - skipping path filter."
            echo "infrastructure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$(git rev-parse --verify --quiet "${HEAD_SHA}^" || true)"
          if [ -z "$base" ]; then
            echo "No parent commit found - deploying to be safe."
            echo "infrastructure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -qE '^infrastructure/'; then
            echo "Infrastructure changed - deployment will run."
            echo "infrastructure=true" >> "$GITHUB_OUTPUT"
          else
            echo "No infrastructure changes - skipping deployment."
            echo "infrastructure=false" >> "$GITHUB_OUTPUT"
          fi

  dry-run-deploy:
    runs-on: ubuntu-latest
    environment: homelab
    needs: check-changes
    if: ${{ needs.check-changes.outputs.infrastructure == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up terraform
        uses: hashicorp/setup-terraform@v4

      - name: Verify terraform installation
        run: |
          terraform -help

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS connection
        run: |
          aws sts get-caller-identity

      - name: Dry-run Deploy Homelab infrastructure
        run: |
          cd infrastructure
          terraform init
          terraform plan -out=tfplan -input=false
          terraform show -no-color tfplan > plan.txt
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: |
            infrastructure/tfplan
            infrastructure/plan.txt
          retention-days: 1

  wait-for-approval:
    runs-on: ubuntu-latest
    needs: dry-run-deploy
    permissions:
      issues: write
    steps:
      - name: Wait for approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.repository_owner }}
          minimum-approvals: 1
          issue-title: "Deploying infrastructure to Homelab"
          issue-body: "Please approve of deny the deployment"
          fail-on-denial: true

  deploy:
    runs-on: ubuntu-latest
    environment: homelab
    needs: wait-for-approval
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up terraform
        uses: hashicorp/setup-terraform@v4

      - name: Verify terraform installation
        run: |
          terraform -help

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS connection
        run: |
          aws sts get-caller-identity

      - name: Download Terraform plan output
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: infrastructure

      - name: Deploy Homelab infrastructure
        run: |
          cd infrastructure
          terraform init
          terraform apply -input=false tfplan
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
